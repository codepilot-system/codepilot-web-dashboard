<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Card background with rounded corners -->
  <rect width="120" height="120" rx="22" fill="url(#bg)"/>

  <!-- Circuit trace lines -->
  <line x1="20" y1="60" x2="40" y2="60" stroke="#334eb8" stroke-width="2.5"/>
  <line x1="80" y1="60" x2="100" y2="60" stroke="#334eb8" stroke-width="2.5"/>
  <line x1="60" y1="20" x2="60" y2="36" stroke="#334eb8" stroke-width="2.5"/>
  <line x1="60" y1="84" x2="60" y2="100" stroke="#334eb8" stroke-width="2.5"/>

  <!-- Corner circuit nodes -->
  <circle cx="20" cy="60" r="3" fill="#334eb8"/>
  <circle cx="100" cy="60" r="3" fill="#334eb8"/>
  <circle cx="60" cy="20" r="3" fill="#334eb8"/>
  <circle cx="60" cy="100" r="3" fill="#334eb8"/>

  <!-- Outer hex ring segments (partial) -->
  <path d="M60 22 L76 31 L76 49" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M60 22 L44 31 L44 49" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M60 98 L76 89 L76 71" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M60 98 L44 89 L44 71" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Center shield / core -->
  <path d="M60 35 L73 42 L73 62 Q73 72 60 78 Q47 72 47 62 L47 42 Z" fill="#1d40af" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Code brackets inside shield -->
  <path d="M54 50 L50 57 L54 64" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <path d="M66 50 L70 57 L66 64" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
  <!-- Slash between brackets -->
  <line x1="62" y1="49" x2="58" y2="65" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
</svg>
